<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDFarms - Pro Profit Tracker v2.0</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a"/>
    <meta name="description" content="Professional farm profit and loss tracker with cloud sync">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #dcfce7;
            --secondary: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
            --text: #4b5563;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2e1 50%, #dbeafe 100%);
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a5f 100%);
            color: #fff;
        }

        /* Header */
        .app-header {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            padding: 20px 24px;
            box-shadow: 0 10px 30px rgba(22, 163, 74, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title {
            font-size: 32px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 4px;
            font-weight: 500;
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            font-weight: 600;
        }

        /* Sync Status */
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .sync-online {
            color: #10b981;
        }

        .sync-offline {
            color: #ef4444;
        }

        .sync-pending {
            color: #f59e0b;
        }

        /* Main Content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Landing Page */
        .landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
        }

        .landing-title {
            font-size: 48px;
            font-weight: 900;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .landing-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            max-width: 500px;
        }

        .nav-btn {
            padding: 20px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 120px;
            text-align: center;
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 10px 30px rgba(22, 163, 74, 0.3);
        }

        .nav-btn-primary:hover {
            box-shadow: 0 15px 40px rgba(22, 163, 74, 0.4);
            transform: translateY(-4px);
        }

        .nav-btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #1d4ed8);
            color: white;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input Styles */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            color: var(--dark);
            font-weight: 500;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.3);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
        }

        /* Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        /* Stat Cards */
        .stat-card {
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.1), rgba(21, 128, 61, 0.1));
            border: 2px solid rgba(22, 163, 74, 0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }

        /* Quick Sell Grid */
        .quick-sell-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }

        .quick-sell-card {
            background: linear-gradient(135deg, #f0fdf4, #dbeafe);
            border-radius: 12px;
            padding: 16px;
            border: 2px solid rgba(22, 163, 74, 0.2);
        }

        .quick-sell-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .quick-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            padding: 14px 16px;
            text-align: left;
            font-weight: 800;
            font-size: 12px;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
        }

        /* Hide sections */
        .hidden {
            display: none;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.warning {
            background: var(--warning);
        }

        /* Sync Controls */
        .sync-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .sync-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sync-btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .sync-btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #1d4ed8);
            color: white;
        }

        /* JSONP Status */
        .jsonp-status {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            font-size: 12px;
            font-weight: 600;
        }

        .jsonp-status.connected {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
            color: var(--success);
        }

        .jsonp-status.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }

            .nav-buttons {
                grid-template-columns: 1fr;
                max-width: 100%;
            }

            .app-title {
                font-size: 24px;
            }

            .landing-title {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Neon PostgreSQL Configuration with JSONP Support
        const API_URL = 'https://gdfarms-app-gdjf.onrender.com';
        const NEON_CONFIG = {
            endpoint: `${API_URL}/api/neon`,
            enabled: true,
            jsonpEnabled: true
        };

        class NeonDB {
            constructor() {
                this.endpoint = NEON_CONFIG.endpoint;
                this.enabled = NEON_CONFIG.enabled;
                this.jsonpEnabled = NEON_CONFIG.jsonpEnabled;
                this.requestCounter = 0;
            }

            async query(endpoint, data = {}) {
                if (!this.enabled) {
                    throw new Error('Neon DB is not enabled');
                }

                // Use JSONP for Neocities hosting
                if (this.jsonpEnabled) {
                    return await this.jsonpQuery(endpoint, data);
                } else {
                    return await this.fetchQuery(endpoint, data);
                }
            }

            async jsonpQuery(endpoint, data = {}) {
                return new Promise((resolve, reject) => {
                    this.requestCounter++;
                    const callbackName = `gdfarms_jsonp_${this.requestCounter}_${Date.now()}`;
                    
                    // Create callback function
                    window[callbackName] = (response) => {
                        // Clean up
                        document.head.removeChild(script);
                        delete window[callbackName];
                        
                        if (response && response.success) {
                            resolve(response);
                        } else {
                            reject(new Error(response?.error || 'JSONP request failed'));
                        }
                    };

                    // Build URL with JSONP parameters
                    const params = new URLSearchParams();
                    params.append('callback', callbackName);
                    params.append('userId', data.userId || '');
                    
                    if (data.data) {
                        params.append('data', JSON.stringify(data.data));
                    }

                    const url = `${this.endpoint}${endpoint}?${params.toString()}`;
                    
                    // Create script tag
                    const script = document.createElement('script');
                    script.src = url;
                    script.onerror = () => {
                        document.head.removeChild(script);
                        delete window[callbackName];
                        reject(new Error('JSONP request failed - network error'));
                    };
                    
                    // Add timeout
                    const timeout = setTimeout(() => {
                        document.head.removeChild(script);
                        delete window[callbackName];
                        reject(new Error('JSONP request timeout'));
                    }, 15000);

                    // Override cleanup to clear timeout
                    const originalCleanup = window[callbackName];
                    window[callbackName] = (response) => {
                        clearTimeout(timeout);
                        originalCleanup(response);
                    };

                    document.head.appendChild(script);
                });
            }

            async fetchQuery(endpoint, data = {}) {
                try {
                    const response = await fetch(this.endpoint + endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    console.error('Fetch query failed:', error);
                    throw error;
                }
            }

            async saveUserData(userId, data) {
                return await this.query('/user-data', { userId, data });
            }

            async loadUserData(userId) {
                return await this.query('/load-user-data', { userId });
            }

            async deleteUserData(userId) {
                return await this.query('/delete-user-data', { userId });
            }

            async testConnection() {
                try {
                    const response = await this.jsonpQuery('/jsonp-test', {});
                    return { success: true, data: response };
                } catch (error) {
                    return { success: false, error: error.message };
                }
            }
        }

        class GDFarmsApp {
            constructor() {
                this.currentPage = 'home';
                this.state = {
                    transportToMarket: 0,
                    transportFromMarket: 0,
                    products: [
                        { id: 1, name: 'Beans', orderPrice: 0, sellingPrice: 0, reserveStock: 0, marketStock: 0 },
                        { id: 2, name: 'Rice', orderPrice: 0, sellingPrice: 0, reserveStock: 0, marketStock: 0 },
                        { id: 3, name: 'Popcorn', orderPrice: 0, sellingPrice: 0, reserveStock: 0, marketStock: 0 },
                    ],
                    transactions: [],
                    newProductName: '',
                    newProductReserveStock: 0,
                    newProductMarketStock: 0,
                    entryDate: new Date().toISOString().split('T')[0],
                    filterDate: '',
                    filterProduct: '',
                };
                
                this.neonDB = new NeonDB();
                this.syncStatus = 'offline';
                this.jsonpStatus = 'disconnected';
                this.userId = this.generateUserId();
                
                this.initNeon();
                this.loadData();
                this.render();
            }

            generateUserId() {
                let userId = localStorage.getItem('gdfarms_userId');
                if (!userId) {
                    userId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('gdfarms_userId', userId);
                }
                return userId;
            }

            async initNeon() {
                try {
                    if (this.neonDB.enabled) {
                        // Test JSONP connection first
                        this.jsonpStatus = 'testing';
                        this.render();
                        
                        const testResult = await this.neonDB.testConnection();
                        
                        if (testResult.success) {
                            this.syncStatus = 'online';
                            this.jsonpStatus = 'connected';
                            console.log('✅ Neon DB connected successfully via JSONP');
                            this.showToast('🚀 Neon PostgreSQL connected - JSONP sync enabled', 'success');
                        } else {
                            this.syncStatus = 'offline';
                            this.jsonpStatus = 'error';
                            console.log('Neon DB available but JSONP failed, using local storage only');
                            this.showToast('⚠️ Cloud sync unavailable - using local storage', 'warning');
                        }
                    } else {
                        this.syncStatus = 'offline';
                        this.jsonpStatus = 'disabled';
                        console.log('Neon DB not available, using local storage only');
                    }
                } catch (error) {
                    console.error('Neon initialization failed:', error);
                    this.syncStatus = 'offline';
                    this.jsonpStatus = 'error';
                }
            }

            async syncToNeon() {
                if (!this.neonDB.enabled) {
                    this.showToast('Neon DB not available', 'warning');
                    return;
                }

                try {
                    this.syncStatus = 'pending';
                    this.render();
                    
                    await this.neonDB.saveUserData(this.userId, this.state);

                    this.syncStatus = 'online';
                    this.showToast('✅ Data synced to Neon PostgreSQL via JSONP', 'success');
                    this.render();
                } catch (error) {
                    console.error('Neon sync failed:', error);
                    this.syncStatus = 'offline';
                    this.showToast('❌ Sync failed: ' + error.message, 'error');
                    this.render();
                }
            }

            async loadFromNeon() {
                if (!this.neonDB.enabled) {
                    this.showToast('Neon DB not available', 'warning');
                    return;
                }

                try {
                    this.syncStatus = 'pending';
                    this.render();
                    
                    const result = await this.neonDB.loadUserData(this.userId);
                    
                    if (result && result.data) {
                        this.state = { ...this.state, ...result.data };
                        this.saveData();
                        this.syncStatus = 'online';
                        this.showToast('✅ Data loaded from Neon PostgreSQL via JSONP', 'success');
                    } else {
                        this.syncStatus = 'online';
                        this.showToast('No cloud data found', 'warning');
                    }
                    
                    this.render();
                } catch (error) {
                    console.error('Neon load failed:', error);
                    this.syncStatus = 'offline';
                    this.showToast('❌ Load failed: ' + error.message, 'error');
                    this.render();
                }
            }

            async clearNeonData() {
                if (!this.neonDB.enabled) {
                    this.showToast('Neon DB not available', 'warning');
                    return;
                }

                if (!confirm('Are you sure you want to delete ALL your cloud data? This cannot be undone.')) {
                    return;
                }

                try {
                    this.syncStatus = 'pending';
                    this.render();
                    
                    await this.neonDB.deleteUserData(this.userId);

                    this.syncStatus = 'online';
                    this.showToast('✅ Cloud data cleared successfully', 'success');
                    this.render();
                } catch (error) {
                    console.error('Neon clear failed:', error);
                    this.syncStatus = 'offline';
                    this.showToast('❌ Clear failed: ' + error.message, 'error');
                    this.render();
                }
            }

            async testJSONPConnection() {
                try {
                    this.jsonpStatus = 'testing';
                    this.render();
                    
                    const result = await this.neonDB.testConnection();
                    
                    if (result.success) {
                        this.jsonpStatus = 'connected';
                        this.syncStatus = 'online';
                        this.showToast('✅ JSONP connection test successful!', 'success');
                    } else {
                        this.jsonpStatus = 'error';
                        this.showToast('❌ JSONP connection test failed', 'error');
                    }
                    
                    this.render();
                } catch (error) {
                    this.jsonpStatus = 'error';
                    this.showToast('❌ JSONP test failed: ' + error.message, 'error');
                    this.render();
                }
            }

            loadData() {
                const saved = localStorage.getItem('gdfarms_data');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        this.state = { ...this.state, ...data };
                    } catch (e) {
                        console.error('Error loading data:', e);
                    }
                }
            }

            saveData() {
                localStorage.setItem('gdfarms_data', JSON.stringify(this.state));
            }

            setState(updates) {
                this.state = { ...this.state, ...updates };
                this.saveData();
                this.render();
            }

            navigateTo(page) {
                this.currentPage = page;
                this.render();
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('show');
                }, 100);

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(toast);
                    }, 300);
                }, 3000);
            }

            quickSell(productId, quantity) {
                const product = this.state.products.find(p => p.id === productId);
                if (!product) return;

                if (quantity > product.marketStock) {
                    this.showToast(`Not enough stock! Only ${product.marketStock}kg available`, 'warning');
                    return;
                }

                const profit = (product.sellingPrice * quantity) - (product.orderPrice * quantity);
                const transaction = {
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    productId: product.id,
                    productName: product.name,
                    quantity: quantity,
                    orderPrice: product.orderPrice,
                    sellingPrice: product.sellingPrice,
                    profit: profit,
                };

                const newTransactions = [...this.state.transactions, transaction];
                const updatedProducts = this.state.products.map(p => 
                    p.id === productId ? { ...p, marketStock: p.marketStock - quantity } : p
                );

                this.setState({
                    transactions: newTransactions,
                    products: updatedProducts,
                });
                
                this.showToast(`Sold ${quantity}kg of ${product.name} - Profit: $${profit.toFixed(2)}`);
            }

            addProduct() {
                if (!this.state.newProductName.trim()) {
                    this.showToast('Enter product name', 'warning');
                    return;
                }

                const newId = Math.max(...this.state.products.map(p => p.id), 0) + 1;
                const newProducts = [...this.state.products, {
                    id: newId,
                    name: this.state.newProductName,
                    orderPrice: 0,
                    sellingPrice: 0,
                    reserveStock: parseFloat(this.state.newProductReserveStock) || 0,
                    marketStock: parseFloat(this.state.newProductMarketStock) || 0
                }];
                
                this.setState({ 
                    products: newProducts, 
                    newProductName: '',
                    newProductReserveStock: 0,
                    newProductMarketStock: 0
                });
                
                this.showToast(`✅ ${this.state.newProductName} added!`);
            }

            updateProductPrice(productId, field, value) {
                const updatedProducts = this.state.products.map(p =>
                    p.id === productId ? { ...p, [field]: parseFloat(value) || 0 } : p
                );
                this.setState({ products: updatedProducts });
            }

            updateStock(productId, field, value) {
                const updatedProducts = this.state.products.map(p =>
                    p.id === productId ? { ...p, [field]: parseFloat(value) || 0 } : p
                );
                this.setState({ products: updatedProducts });
            }

            getFilteredTransactions() {
                return this.state.transactions.filter(t => {
                    const dateMatch = !this.state.filterDate || t.date === this.state.filterDate;
                    const productMatch = !this.state.filterProduct || t.productId === parseInt(this.state.filterProduct);
                    return dateMatch && productMatch;
                });
            }

            getTodaysProfit() {
                const today = new Date().toISOString().split('T')[0];
                const todaysTransactions = this.state.transactions.filter(t => t.date === today);
                return todaysTransactions.reduce((sum, t) => sum + t.profit, 0);
            }

            exportData() {
                const backup = {
                    exportDate: new Date().toISOString(),
                    data: this.state
                };
                const json = JSON.stringify(backup, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `GDFarms_Backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                this.showToast('✅ Data exported successfully!');
            }

            importData(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const backup = JSON.parse(e.target.result);
                        if (backup.data) {
                            this.setState(backup.data);
                            this.showToast('✅ Data imported successfully!');
                        }
                    } catch (error) {
                        this.showToast('❌ Error importing file', 'error');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            clearAllData() {
                if (!confirm('Are you sure you want to clear ALL data? This action cannot be undone.')) {
                    return;
                }

                this.state = {
                    transportToMarket: 0,
                    transportFromMarket: 0,
                    products: [
                        { id: 1, name: 'Beans', orderPrice: 0, sellingPrice: 0, reserveStock: 0, marketStock: 0 },
                        { id: 2, name: 'Rice', orderPrice: 0, sellingPrice: 0, reserveStock: 0, marketStock: 0 },
                        { id: 3, name: 'Popcorn', orderPrice: 0, sellingPrice: 0, reserveStock: 0, marketStock: 0 },
                    ],
                    transactions: [],
                    newProductName: '',
                    newProductReserveStock: 0,
                    newProductMarketStock: 0,
                    entryDate: new Date().toISOString().split('T')[0],
                    filterDate: '',
                    filterProduct: '',
                };
                this.saveData();
                this.render();
                this.showToast('All data cleared successfully');
            }

            renderHome() {
                const totalProfit = this.state.transactions.reduce((sum, t) => sum + t.profit, 0);
                const totalSales = this.state.transactions.length;
                const totalQuantity = this.state.transactions.reduce((sum, t) => sum + t.quantity, 0);
                const todaysProfit = this.getTodaysProfit();

                return `
                    <div class="landing-page">
                        <div class="landing-title">🚜 GDFarms v2.0</div>
                        <div class="landing-subtitle">Professional Profit & Loss Tracker with JSONP Cloud Sync</div>
                        
                        <div class="nav-buttons">
                            <button class="nav-btn nav-btn-primary" onclick="app.navigateTo('sell')">
                                <div>💰</div>
                                <div>Quick Sell</div>
                            </button>
                            <button class="nav-btn nav-btn-primary" onclick="app.navigateTo('stock')">
                                <div>📦</div>
                                <div>Manage Stock</div>
                            </button>
                            <button class="nav-btn nav-btn-secondary" onclick="app.navigateTo('history')">
                                <div>📋</div>
                                <div>History</div>
                            </button>
                            <button class="nav-btn nav-btn-secondary" onclick="app.navigateTo('summary')">
                                <div>📈</div>
                                <div>Summary</div>
                            </button>
                            <button class="nav-btn nav-btn-primary" onclick="app.navigateTo('backup')" style="grid-column: 1 / -1;">
                                <div>💾</div>
                                <div>Backup & Restore</div>
                            </button>
                        </div>

                        <div style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px; width: 100%; max-width: 600px;">
                            <div class="stat-card">
                                <div class="stat-label">📈 Total Profit</div>
                                <div class="stat-value" style="color: ${totalProfit >= 0 ? 'var(--success)' : 'var(--danger)'}">$${totalProfit.toFixed(2)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">📊 Total Sales</div>
                                <div class="stat-value">${totalSales}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">⚖️ Total Quantity</div>
                                <div class="stat-value">${totalQuantity}kg</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">📅 Today's Profit</div>
                                <div class="stat-value" style="color: ${todaysProfit >= 0 ? 'var(--success)' : 'var(--danger)'}">$${todaysProfit.toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderQuickSell() {
                return `
                    <button class="back-btn" onclick="app.navigateTo('home')">← Back Home</button>
                    
                    <div class="card">
                        <div class="card-title">💰 Quick Sell</div>
                        <div class="quick-sell-grid">
                            ${this.state.products.map(p => `
                                <div class="quick-sell-card">
                                    <div style="font-weight: 800; font-size: 15px; color: var(--dark); margin-bottom: 4px;">${p.name}</div>
                                    <div style="font-size: 11px; color: var(--text); font-weight: 600; margin-bottom: 8px;">
                                        Market Stock: <strong style="color: var(--primary);">${p.marketStock}kg</strong>
                                    </div>
                                    
                                    <div class="quick-sell-buttons">
                                        <button class="quick-btn" onclick="app.quickSell(${p.id}, 0.5)">0.5kg</button>
                                        <button class="quick-btn" onclick="app.quickSell(${p.id}, 1)">1kg</button>
                                        <button class="quick-btn" onclick="app.quickSell(${p.id}, 2)">2kg</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderStock() {
                return `
                    <button class="back-btn" onclick="app.navigateTo('home')">← Back Home</button>
                    
                    <div class="card">
                        <div class="card-title">📦 Current Stock</div>
                        <div class="grid-3">
                            ${this.state.products.map(p => `
                                <div style="background: linear-gradient(135deg, #f0fdf4, #dbeafe); border-radius: 12px; padding: 14px; border: 2px solid rgba(22, 163, 74, 0.2);">
                                    <div style="font-weight: 800; font-size: 14px; color: var(--dark); margin-bottom: 8px;">${p.name}</div>
                                    
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                                        <div>
                                            <div class="input-label">Reserve Stock (kg)</div>
                                            <input type="number" value="${p.reserveStock}" class="form-input" onchange="app.updateStock(${p.id}, 'reserveStock', this.value)">
                                        </div>
                                        <div>
                                            <div class="input-label">Market Stock (kg)</div>
                                            <input type="number" value="${p.marketStock}" class="form-input" onchange="app.updateStock(${p.id}, 'marketStock', this.value)">
                                        </div>
                                    </div>
                                    
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                        <div>
                                            <div class="input-label">Order Price ($)</div>
                                            <input type="number" value="${p.orderPrice}" class="form-input" onchange="app.updateProductPrice(${p.id}, 'orderPrice', this.value)">
                                        </div>
                                        <div>
                                            <div class="input-label">Selling Price ($)</div>
                                            <input type="number" value="${p.sellingPrice}" class="form-input" onchange="app.updateProductPrice(${p.id}, 'sellingPrice', this.value)">
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">➕ Add New Product</div>
                        <div class="grid-3">
                            <div class="input-group">
                                <label class="input-label">Product Name</label>
                                <input type="text" value="${this.state.newProductName}" class="form-input" placeholder="e.g., Maize, Cassava" onchange="app.setState({newProductName: this.value})">
                            </div>
                            <div class="input-group">
                                <label class="input-label">Reserve Stock (kg)</label>
                                <input type="number" value="${this.state.newProductReserveStock}" class="form-input" placeholder="0.00" onchange="app.setState({newProductReserveStock: parseFloat(this.value) || 0})">
                            </div>
                            <div class="input-group">
                                <label class="input-label">Market Stock (kg)</label>
                                <input type="number" value="${this.state.newProductMarketStock}" class="form-input" placeholder="0.00" onchange="app.setState({newProductMarketStock: parseFloat(this.value) || 0})">
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="app.addProduct()">➕ Add Product</button>
                    </div>
                `;
            }

            renderHistory() {
                const filteredTransactions = this.getFilteredTransactions();
                
                return `
                    <button class="back-btn" onclick="app.navigateTo('home')">← Back Home</button>
                    
                    <div class="card">
                        <div class="card-title">📋 Transaction History</div>
                        
                        <div class="grid-2">
                            <div class="input-group">
                                <label class="input-label">Filter by Date</label>
                                <input type="date" value="${this.state.filterDate}" class="form-input" onchange="app.setState({filterDate: this.value})">
                            </div>
                            <div class="input-group">
                                <label class="input-label">Filter by Product</label>
                                <select class="form-input" onchange="app.setState({filterProduct: this.value})">
                                    <option value="">All Products</option>
                                    ${this.state.products.map(p => `<option value="${p.id}" ${this.state.filterProduct == p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Product</th>
                                        <th>Quantity</th>
                                        <th>Order Price</th>
                                        <th>Selling Price</th>
                                        <th>Profit/Loss</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filteredTransactions.length > 0 ? filteredTransactions.map(t => `
                                        <tr>
                                            <td>${t.date}</td>
                                            <td>${t.productName}</td>
                                            <td>${t.quantity}kg</td>
                                            <td>$${t.orderPrice}</td>
                                            <td>$${t.sellingPrice}</td>
                                            <td style="color: ${t.profit >= 0 ? 'var(--success)' : 'var(--danger)'}; font-weight: 700;">$${t.profit.toFixed(2)}</td>
                                        </tr>
                                    `).join('') : `
                                        <tr>
                                            <td colspan="6" style="text-align: center; padding: 40px; color: var(--text);">No transactions found</td>
                                        </tr>
                                    `}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            renderSummary() {
                const totalProfit = this.state.transactions.reduce((sum, t) => sum + t.profit, 0);
                const totalSales = this.state.transactions.length;
                const totalQuantity = this.state.transactions.reduce((sum, t) => sum + t.quantity, 0);
                
                const productStats = this.state.products.map(p => {
                    const productTransactions = this.state.transactions.filter(t => t.productId === p.id);
                    const productProfit = productTransactions.reduce((sum, t) => sum + t.profit, 0);
                    const productQuantity = productTransactions.reduce((sum, t) => sum + t.quantity, 0);
                    
                    return {
                        name: p.name,
                        profit: productProfit,
                        quantity: productQuantity,
                        sales: productTransactions.length
                    };
                });
                
                return `
                    <button class="back-btn" onclick="app.navigateTo('home')">← Back Home</button>
                    
                    <div class="card">
                        <div class="card-title">📈 Financial Summary</div>
                        <div class="grid-3">
                            <div class="stat-card">
                                <div class="stat-label">💰 Total Profit</div>
                                <div class="stat-value" style="color: ${totalProfit >= 0 ? 'var(--success)' : 'var(--danger)'}">$${totalProfit.toFixed(2)}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">📊 Total Sales</div>
                                <div class="stat-value">${totalSales}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">⚖️ Total Quantity</div>
                                <div class="stat-value">${totalQuantity}kg</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">📊 Product Performance</div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Total Profit</th>
                                        <th>Total Sales</th>
                                        <th>Total Quantity</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${productStats.map(ps => `
                                        <tr>
                                            <td>${ps.name}</td>
                                            <td style="color: ${ps.profit >= 0 ? 'var(--success)' : 'var(--danger)'}">$${ps.profit.toFixed(2)}</td>
                                            <td>${ps.sales}</td>
                                            <td>${ps.quantity}kg</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            renderBackup() {
                const jsonpStatusText = this.jsonpStatus === 'connected' ? '✅ Connected' : 
                                      this.jsonpStatus === 'testing' ? '🔄 Testing...' : 
                                      this.jsonpStatus === 'error' ? '❌ Connection Failed' : '⚪ Disconnected';

                return `
                    <button class="back-btn" onclick="app.navigateTo('home')">← Back Home</button>
                    
                    <div class="card">
                        <div class="card-title">💾 Backup & Restore v2.0</div>
                        
                        <div class="jsonp-status ${this.jsonpStatus === 'connected' ? 'connected' : this.jsonpStatus === 'error' ? 'error' : ''}">
                            <div style="display: flex; justify-content: between; align-items: center;">
                                <span>📡 JSONP Connection: ${jsonpStatusText}</span>
                                <button class="sync-btn sync-btn-secondary" onclick="app.testJSONPConnection()" style="margin-left: auto;">Test Connection</button>
                            </div>
                        </div>
                        
                        <div class="grid-2">
                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <div class="input-group">
                                    <label class="input-label">Export Data</label>
                                    <p style="font-size: 14px; color: var(--text); margin-bottom: 10px;">Download a backup of all your data</p>
                                    <button class="btn btn-primary" onclick="app.exportData()">📥 Export JSON Backup</button>
                                </div>

                                <div class="input-group">
                                    <label class="input-label">Neon PostgreSQL Sync</label>
                                    <p style="font-size: 14px; color: var(--text); margin-bottom: 10px;">Status: <span class="sync-${this.syncStatus}">${this.syncStatus.toUpperCase()}</span></p>
                                    <div class="sync-controls">
                                        <button class="sync-btn sync-btn-primary" onclick="app.syncToNeon()">📤 Sync to Neon</button>
                                        <button class="sync-btn sync-btn-secondary" onclick="app.loadFromNeon()">📥 Load from Neon</button>
                                        <button class="sync-btn btn-danger" onclick="app.clearNeonData()">🗑️ Clear Cloud</button>
                                    </div>
                                </div>
                            </div>
                            
                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <div class="input-group">
                                    <label class="input-label">Import Data</label>
                                    <p style="font-size: 14px; color: var(--text); margin-bottom: 10px;">Restore from a previous backup</p>
                                    <input type="file" id="importFile" accept=".json" class="form-input" onchange="app.importData(event)">
                                </div>
                                
                                <div class="input-group">
                                    <label class="input-label">Clear All Data</label>
                                    <p style="font-size: 14px; color: var(--text); margin-bottom: 10px;">⚠️ This will permanently delete all your data</p>
                                    <button class="btn btn-danger" onclick="app.clearAllData()">🗑️ Clear All Data</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">📊 Data Statistics</div>
                        <div class="grid-3">
                            <div class="stat-card">
                                <div class="stat-label">Products</div>
                                <div class="stat-value">${this.state.products.length}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Transactions</div>
                                <div class="stat-value">${this.state.transactions.length}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Data Size</div>
                                <div class="stat-value">${(JSON.stringify(this.state).length / 1024).toFixed(2)}KB</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            render() {
                const app = document.getElementById('app');
                
                let content = '';
                switch (this.currentPage) {
                    case 'home': content = this.renderHome(); break;
                    case 'sell': content = this.renderQuickSell(); break;
                    case 'stock': content = this.renderStock(); break;
                    case 'history': content = this.renderHistory(); break;
                    case 'summary': content = this.renderSummary(); break;
                    case 'backup': content = this.renderBackup(); break;
                    default: content = this.renderHome();
                }
                
                app.innerHTML = `
                    <div class="app-container">
                        <div class="app-header">
                            <div class="header-content">
                                <div>
                                    <div class="app-title">🚜 GDFarms v2.0</div>
                                    <div class="app-subtitle">Professional Profit & Loss Tracker with JSONP Cloud Sync</div>
                                </div>
                                <div class="header-stats">
                                    <div class="stat-pill">📦 ${this.state.products.length} Products</div>
                                    <div class="stat-pill">💰 ${this.state.transactions.length} Sales</div>
                                    <div class="sync-status sync-${this.syncStatus}">
                                        <div class="sync-indicator">●</div>
                                        ${this.syncStatus.toUpperCase()}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="app-content">
                            ${content}
                        </div>
                    </div>
                `;
            }
        }

        // Initialize the app
        const app = new GDFarmsApp();
    </script>
</body>
</html>
